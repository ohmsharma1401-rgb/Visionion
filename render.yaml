services:
  - type: web
    name: visionion-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: visionion-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_BASE_URL
        fromService:
          name: visionion-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATA_DIR
        value: /tmp/visionion-cache
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"

  - type: web
    name: visionion-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: visionion-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
